name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Install Rust nightly (for fmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly fmt --all --check

      - name: Cargo check (warnings as errors)
        run: cargo check --locked --all-targets
        env:
          RUSTFLAGS: "-D warnings"

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --all-targets --verbose

      - name: Verify checkpoint fixture is reproducible
        run: cargo run --locked --example generate_checkpoint_fixture -- --check

      - name: Release build
        run: cargo build --locked --release
